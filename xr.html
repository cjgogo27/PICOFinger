<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HandPlay · VR 手部追踪</title>
<style>
  html,body { margin:0; height:100%; background:#0b0d12; color:#e6e8ee;
              font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; overflow:hidden; }
  #hud { position:fixed; left:0; top:0; right:0; padding:14px 18px; z-index:10;
         background:linear-gradient(#0b0d12ee,#0b0d1200); pointer-events:none; }
  #hud h1 { font-size:16px; margin:0 0 6px; font-weight:600; }
  #stat { font-size:12px; line-height:1.7; color:#8b93a7; }
  #stat b { color:#e6e8ee; }
  .ok { color:#31c48d !important; } .bad { color:#f05252 !important; }
  #start { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
           padding:16px 28px; font-size:17px; border-radius:12px; border:0;
           background:#1f6feb; color:#fff; font-weight:600; z-index:20; }
  #start:disabled { opacity:.5; }
  canvas { display:block; }
  #tip { position:fixed; bottom:18px; left:0; right:0; text-align:center;
         font-size:12px; color:#6b7280; z-index:10; }
</style>
</head>
<body>
<div id="hud">
  <h1>HandPlay · VR 手部追踪</h1>
  <div id="stat">等待进入 VR…</div>
</div>
<button id="start">进入 VR</button>
<div id="tip">需要先在 PICO 设置里开启「手部追踪」</div>
<canvas id="cv"></canvas>
<script>
const JOINTS = [
  "wrist",
  "thumb-metacarpal","thumb-phalanx-proximal","thumb-phalanx-distal","thumb-tip",
  "index-finger-metacarpal","index-finger-phalanx-proximal","index-finger-phalanx-intermediate","index-finger-phalanx-distal","index-finger-tip",
  "middle-finger-metacarpal","middle-finger-phalanx-proximal","middle-finger-phalanx-intermediate","middle-finger-phalanx-distal","middle-finger-tip",
  "ring-finger-metacarpal","ring-finger-phalanx-proximal","ring-finger-phalanx-intermediate","ring-finger-phalanx-distal","ring-finger-tip",
  "pinky-finger-metacarpal","pinky-finger-phalanx-proximal","pinky-finger-phalanx-intermediate","pinky-finger-phalanx-distal","pinky-finger-tip"
];
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[8,9],
               [0,10],[10,11],[11,12],[12,13],[13,14],[0,15],[15,16],[16,17],[17,18],[18,19],
               [0,20],[20,21],[21,22],[22,23],[23,24]];

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stat = document.getElementById('stat');
const btn = document.getElementById('start');

let ws = null, sending = 0, fps = 0, tPrev = 0;
let lastPts = null;

function resize(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
                   ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener('resize', resize); resize();

function connectWS(){
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/xr';
  ws = new WebSocket(url);
  ws.onopen = () => { stat.innerHTML += '<div class="ok">WebSocket 已连接</div>'; };
  ws.onclose = () => { stat.innerHTML += '<div class="bad">WebSocket 断开</div>'; };
  ws.onerror = () => { stat.innerHTML += '<div class="bad">WebSocket 错误</div>'; };
}

function draw(pts){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!pts) return;
  // 极简投影：用 x,y，z 忽略
  const cx = innerWidth/2, cy = innerHeight/2, S = innerWidth * 1.6;
  const P = pts.map(p => [cx + p[0]*S, cy - p[1]*S]);
  ctx.strokeStyle = '#31c48d'; ctx.lineWidth = 2;
  for(const [a,b] of BONES){
    ctx.beginPath(); ctx.moveTo(P[a][0],P[a][1]); ctx.lineTo(P[b][0],P[b][1]); ctx.stroke();
  }
  ctx.fillStyle = '#f05252';
  for(const p of P){ ctx.beginPath(); ctx.arc(p[0],p[1],3,0,6.283); ctx.fill(); }
}

async function enter(){
  if(!navigator.xr){ alert('这个浏览器不支持 WebXR'); return; }
  // PICO / Quest 对 ar 与 vr 的支持不同，两个都试
  let session = null, lastErr = null;
  for(const m of ['immersive-ar', 'immersive-vr']){
    try{
      if(!(await navigator.xr.isSessionSupported(m))) continue;
      session = await navigator.xr.requestSession(m, {
        requiredFeatures: ['hand-tracking'],
        optionalFeatures: ['local-floor']
      });
      break;
    }catch(e){ lastErr = e; }
  }
  if(!session){ alert('无法进入 VR 会话（可能没开启手部追踪）：' + (lastErr ? lastErr.message : '')); return; }
  btn.style.display = 'none';
  session.addEventListener('end', () => { btn.style.display = 'block'; stat.innerHTML += '<div>会话结束</div>'; });
  const refSpace = await session.requestReferenceSpace('local');
  session.requestAnimationFrame(onFrame);

  function onFrame(t, frame){
    session.requestAnimationFrame(onFrame);
    let pts = null;
    const srcs = session.inputSources;
    let nSrc = srcs ? srcs.length : 0, nHand = 0;
    for(const src of (srcs || [])){
      if(src.hand) nHand++;
    }
    for(const src of (srcs || [])){
      if(!src.hand) continue;
      pts = [];
      for(const name of JOINTS){
        const joint = src.hand.get(name);
        const pose = joint && frame.getJointPose(joint, refSpace);
        if(!pose){ pts = null; break; }
        pts.push([pose.transform.position.x, pose.transform.position.y, pose.transform.position.z]);
      }
      if(pts) break;
    }
    if(pts){
      lastPts = pts;
      if(ws && ws.readyState === 1){
        ws.send(JSON.stringify({ t: Date.now(), hand: pts }));
        sending++;
      }
    }
    draw(lastPts);
    if(t - tPrev > 500){
      fps = (fps*0.5 + (sending*1000/(t-tPrev))*0.5) || 0;
      sending = 0; tPrev = t;
      const handTxt = nHand > 0 ? '<b class="ok">已追踪</b>' : '<b class="bad">未追踪</b>';
      stat.innerHTML = '<div>手：' + handTxt + '</div>' +
                       '<div>输入源：<b>' + nSrc + '</b> 个，含手部数据 <b>' + nHand + '</b> 个</div>' +
                       '<div>发送：<b>' + fps.toFixed(0) + '</b> Hz</div>' +
                       '<div>WebSocket：<b>' + (ws && ws.readyState===1 ? '已连接' : '未连接') + '</b></div>';
    }
  }
}

btn.onclick = () => { connectWS(); enter().catch(e => { alert('进入失败：' + e.message); console.error(e); }); };
</script>
</body>
</html>
